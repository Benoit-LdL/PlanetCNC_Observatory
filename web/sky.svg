<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="#fff">
  <!-- The page background's texture: stars and planets in the style of the logo. Drawn white;
       style.css shows it barely visible (and inverted in day mode). -->
  <defs>
    <path id="s" d="M0-10C1-3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10z"/>
    <clipPath id="giant"><circle cx="560" cy="575" r="26"/></clipPath>
  </defs>

  <!-- four-point stars -->
  <use href="#s" transform="translate(84 96) scale(1.1)"/>
  <use href="#s" transform="translate(262 48) scale(.6)"/>
  <use href="#s" transform="translate(468 140) scale(.9)"/>
  <use href="#s" transform="translate(652 64) scale(.5)"/>
  <use href="#s" transform="translate(40 330) scale(.55)"/>
  <use href="#s" transform="translate(330 300) scale(.7)"/>
  <use href="#s" transform="translate(610 380) scale(1.2)"/>
  <use href="#s" transform="translate(180 520) scale(.8)"/>
  <use href="#s" transform="translate(420 600) scale(.55)"/>
  <use href="#s" transform="translate(690 640) scale(.7)"/>
  <use href="#s" transform="translate(140 30) scale(.45)"/>
  <use href="#s" transform="translate(360 110) scale(.4)"/>
  <use href="#s" transform="translate(560 30) scale(.75)"/>
  <use href="#s" transform="translate(30 250) scale(.4)"/>
  <use href="#s" transform="translate(240 250) scale(.5)"/>
  <use href="#s" transform="translate(450 410) scale(.45)"/>
  <use href="#s" transform="translate(700 300) scale(.5)"/>
  <use href="#s" transform="translate(90 590) scale(.6)"/>
  <use href="#s" transform="translate(270 700) scale(.45)"/>
  <use href="#s" transform="translate(500 690) scale(.6)"/>
  <use href="#s" transform="translate(640 160) scale(.35)"/>
  <use href="#s" transform="translate(150 380) scale(.35)"/>
  <use href="#s" transform="translate(380 460) scale(.8)"/>
  <use href="#s" transform="translate(600 500) scale(.35)"/>

  <!-- small stars -->
  <circle cx="150" cy="220" r="2"/>
  <circle cx="390" cy="40" r="1.5"/>
  <circle cx="560" cy="250" r="2"/>
  <circle cx="250" cy="410" r="1.5"/>
  <circle cx="500" cy="470" r="2.5"/>
  <circle cx="610" cy="560" r="1.5"/>
  <circle cx="330" cy="690" r="2"/>
  <circle cx="20" cy="40" r="1.5"/>
  <circle cx="200" cy="80" r="1.2"/>
  <circle cx="310" cy="20" r="2"/>
  <circle cx="440" cy="80" r="1.5"/>
  <circle cx="610" cy="110" r="1.2"/>
  <circle cx="705" cy="190" r="2"/>
  <circle cx="70" cy="420" r="1.5"/>
  <circle cx="210" cy="340" r="1.2"/>
  <circle cx="290" cy="360" r="2"/>
  <circle cx="420" cy="350" r="1.2"/>
  <circle cx="480" cy="250" r="1.5"/>
  <circle cx="660" cy="440" r="1.2"/>
  <circle cx="20" cy="520" r="2"/>
  <circle cx="240" cy="590" r="1.5"/>
  <circle cx="350" cy="540" r="1.2"/>
  <circle cx="460" cy="530" r="1.5"/>
  <circle cx="160" cy="680" r="1.2"/>
  <circle cx="420" cy="705" r="1.5"/>
  <circle cx="600" cy="660" r="2"/>
  <circle cx="700" cy="560" r="1.2"/>
  <circle cx="540" cy="190" r="1.2"/>

  <!-- ringed planet -->
  <g transform="translate(200 160) rotate(-18)">
    <circle r="22"/>
    <ellipse rx="40" ry="9" fill="none" stroke="#fff" stroke-width="4"/>
  </g>
  <!-- distant ringed planet -->
  <g transform="translate(660 230) rotate(12)">
    <circle r="9"/>
    <ellipse rx="17" ry="4" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- steep-ringed planet -->
  <g transform="translate(390 240) rotate(62)">
    <circle r="10"/>
    <ellipse rx="21" ry="3.5" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- banded gas giant -->
  <circle cx="560" cy="575" r="26" fill="none" stroke="#fff" stroke-width="3"/>
  <g clip-path="url(#giant)" stroke="#fff" fill="none">
    <path d="M530 565q30 6 60 0" stroke-width="3"/>
    <path d="M530 578q30 6 60 0" stroke-width="5"/>
    <path d="M530 592q30 5 60 0" stroke-width="2.5"/>
  </g>
  <!-- cratered planet -->
  <path fill-rule="evenodd" d="M110 452a18 18 0 1 1 0 36a18 18 0 1 1 0-36zM104 460a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM117 471a5.5 5.5 0 1 0 0 11a5.5 5.5 0 1 0 0-11zM102 477a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z"/>
  <!-- planet drawn as an outline, with a thin ring -->
  <g transform="translate(52 170) rotate(-30)">
    <circle r="11" fill="none" stroke="#fff" stroke-width="2.5"/>
    <path d="M-22 0a22 5 0 0 0 44 0" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- small planets -->
  <circle cx="520" cy="330" r="12"/>
  <circle cx="300" cy="630" r="7"/>
  <circle cx="680" cy="470" r="5"/>
  <circle cx="290" cy="170" r="4"/>
  <circle cx="440" cy="660" r="9" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- crescent -->
  <path d="M400 520a34 34 0 1 0 30 50a26 26 0 1 1-30-50z"/>
</svg>
